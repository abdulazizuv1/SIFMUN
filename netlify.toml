# Netlify build settings for the SIFMUN site.
# In Netlify, set "Base directory" to `site` if the repository root is the parent folder.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every clean URL (/history, /team, /register, /admin) serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

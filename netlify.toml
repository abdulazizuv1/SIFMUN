# Netlify build settings for the SIFMUN site.
# In Netlify, set "Base directory" to `site` if the repository root is the parent folder.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# One address for everyone: the Netlify subdomain forwards to the site's own domain.
[[redirects]]
  from = "https://sifmun.netlify.app/*"
  to = "https://sifmun.uz/:splat"
  status = 301
  force = true

# Single-page app: every clean URL (/history, /team, /register, /admin) serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos and the hero films: cached for a day, so a returning visitor does not
# download the film again. Not immutable: these files are swap points.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
